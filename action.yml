name: Assevra
description: >-
  Score your AI agent's reliability, gate the build on a regression, and publish
  a signed scorecard as release evidence.
author: Veera Ravindra Divi and Sneha Gullapalli
branding:
  icon: shield
  color: purple

# Usage:
#
#   - uses: assevra/assevra@v1
#     with:
#       dataset: evals/agent.jsonl
#       gate: true
#     env:
#       ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
#
# Everything the action does works without a key: the deterministic dimensions
# always run, and the judged ones are reported as SKIPPED — never as passing —
# when no provider is configured. That is deliberate, because it is what lets a
# pull request from a fork get a real gate instead of a red build.

inputs:
  dataset:
    description: "Path to the labeled JSONL dataset. Defaults to `dataset:` in .assevra.yml."
    required: false
    default: ""
  config:
    description: "Path to .assevra.yml (default: discovered by walking up from the repo root)."
    required: false
    default: ""
  out-dir:
    description: "Directory for the scorecard artifacts."
    required: false
    default: ".assevra/out"
  gate:
    description: "Fail the build when a scored dimension falls below its threshold."
    required: false
    default: "true"
  strict:
    description: "Also fail when a row carries no answer key (an unlabeled row is a vacuous pass)."
    required: false
    default: "false"
  fail-on-regression:
    description: "Fail when a dimension regressed against the recorded baseline."
    required: false
    default: "false"
  history:
    description: "Run-history JSONL file, enabling regression detection across runs."
    required: false
    default: ""
  label:
    description: "Label for this run in the history — a git SHA or a version."
    required: false
    default: ""
  baseline:
    description: "Compare against the most recent history run carrying this label."
    required: false
    default: ""
  judge-provider:
    description: "anthropic | openai | azure | bedrock | gemini | local | mock | none | auto"
    required: false
    default: "auto"
  judge-model:
    description: "Judge model or deployment name."
    required: false
    default: ""
  judge-panel:
    description: "Comma-separated models to use as a jury; entries may be provider:model."
    required: false
    default: ""
  attest:
    description: "Also emit an Agent Card mapping the evidence to governance frameworks."
    required: false
    default: "false"
  sign-key:
    description: "Path to an Ed25519 private key (PEM) to sign the scorecard. Use a secret file."
    required: false
    default: ""
  extras:
    description: "pip extras to install, e.g. 'pii,anthropic,sign'. Empty installs the core only."
    required: false
    default: ""
  version:
    description: "Assevra version specifier, e.g. '0.6.0'. Defaults to this action release."
    required: false
    default: "0.6.0"
  skip-install:
    description: >-
      Assume `assevra` is already installed and on PATH. Set this when a job has
      installed a local checkout (or a pinned build) that the action must not
      replace with the published wheel.
    required: false
    default: "false"
  python-version:
    description: "Python to run on."
    required: false
    default: "3.12"
  comment:
    description: "Write the scorecard summary to the GitHub job summary."
    required: false
    default: "true"
  upload-artifact:
    description: "Upload the scorecard artifacts to the workflow run."
    required: false
    default: "true"
  artifact-name:
    description: "Name for the uploaded artifact."
    required: false
    default: "assevra-scorecard"

outputs:
  passed:
    description: "'true' when every scored dimension passed."
    value: ${{ steps.score.outputs.passed }}
  scorecard:
    description: "Path to the JSON scorecard."
    value: ${{ steps.score.outputs.scorecard }}
  html:
    description: "Path to the styled HTML report."
    value: ${{ steps.score.outputs.html }}
  summary:
    description: "One-line verdict, e.g. '7/8 dimensions passed over 214 rows'."
    value: ${{ steps.score.outputs.summary }}

runs:
  using: composite
  steps:
    - name: Set up Python
      if: inputs.skip-install != 'true'
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Assevra
      if: inputs.skip-install != 'true'
      shell: bash
      env:
        ASSEVRA_INPUT_EXTRAS: ${{ inputs.extras }}
        ASSEVRA_INPUT_VERSION: ${{ inputs.version }}
      run: |
        python -m pip install --upgrade pip
        spec="assevra"
        if [ -n "$ASSEVRA_INPUT_VERSION" ]; then spec="assevra==$ASSEVRA_INPUT_VERSION"; fi
        if [ -n "$ASSEVRA_INPUT_EXTRAS" ]; then spec="assevra[$ASSEVRA_INPUT_EXTRAS]"; fi
        if [ -n "$ASSEVRA_INPUT_VERSION" ] && [ -n "$ASSEVRA_INPUT_EXTRAS" ]; then
          spec="assevra[$ASSEVRA_INPUT_EXTRAS]==$ASSEVRA_INPUT_VERSION"
        fi
        echo "installing $spec"
        pip install "$spec"
        assevra --version
    - name: Validate the dataset before scoring it
      shell: bash
      env:
        ASSEVRA_INPUT_CONFIG: ${{ inputs.config }}
        ASSEVRA_INPUT_DATASET: ${{ inputs.dataset }}
        ASSEVRA_INPUT_STRICT: ${{ inputs.strict }}
      run: |
        args=()
        [ -n "$ASSEVRA_INPUT_DATASET" ] && args+=("$ASSEVRA_INPUT_DATASET")
        [ -n "$ASSEVRA_INPUT_CONFIG" ] && args+=(--config "$ASSEVRA_INPUT_CONFIG")
        [ "$ASSEVRA_INPUT_STRICT" = "true" ] && args+=(--strict)
        assevra validate "${args[@]}"
    - name: Score the agent
      id: score
      shell: bash
      env:
        ASSEVRA_INPUT_ATTEST: ${{ inputs.attest }}
        ASSEVRA_INPUT_BASELINE: ${{ inputs.baseline }}
        ASSEVRA_INPUT_COMMENT: ${{ inputs.comment }}
        ASSEVRA_INPUT_CONFIG: ${{ inputs.config }}
        ASSEVRA_INPUT_DATASET: ${{ inputs.dataset }}
        ASSEVRA_INPUT_FAIL_ON_REGRESSION: ${{ inputs.fail-on-regression }}
        ASSEVRA_INPUT_GATE: ${{ inputs.gate }}
        ASSEVRA_INPUT_HISTORY: ${{ inputs.history }}
        ASSEVRA_INPUT_JUDGE_MODEL: ${{ inputs.judge-model }}
        ASSEVRA_INPUT_JUDGE_PANEL: ${{ inputs.judge-panel }}
        ASSEVRA_INPUT_JUDGE_PROVIDER: ${{ inputs.judge-provider }}
        ASSEVRA_INPUT_LABEL: ${{ inputs.label }}
        ASSEVRA_INPUT_OUT_DIR: ${{ inputs.out-dir }}
        ASSEVRA_INPUT_SIGN_KEY: ${{ inputs.sign-key }}
        ASSEVRA_INPUT_STRICT: ${{ inputs.strict }}
      run: |
        args=(--out-dir "$ASSEVRA_INPUT_OUT_DIR")
        [ -n "$ASSEVRA_INPUT_DATASET" ] && args+=(--dataset "$ASSEVRA_INPUT_DATASET")
        [ -n "$ASSEVRA_INPUT_CONFIG" ] && args+=(--config "$ASSEVRA_INPUT_CONFIG")
        [ -n "$ASSEVRA_INPUT_HISTORY" ] && args+=(--history "$ASSEVRA_INPUT_HISTORY")
        [ -n "$ASSEVRA_INPUT_LABEL" ] && args+=(--label "$ASSEVRA_INPUT_LABEL")
        [ -n "$ASSEVRA_INPUT_BASELINE" ] && args+=(--baseline "$ASSEVRA_INPUT_BASELINE")
        [ -n "$ASSEVRA_INPUT_JUDGE_MODEL" ] && args+=(--judge-model "$ASSEVRA_INPUT_JUDGE_MODEL")
        [ -n "$ASSEVRA_INPUT_JUDGE_PANEL" ] && args+=(--judge-panel "$ASSEVRA_INPUT_JUDGE_PANEL")
        [ -n "$ASSEVRA_INPUT_SIGN_KEY" ] && args+=(--sign "$ASSEVRA_INPUT_SIGN_KEY")
        [ "$ASSEVRA_INPUT_JUDGE_PROVIDER" != "auto" ] && args+=(--judge-provider "$ASSEVRA_INPUT_JUDGE_PROVIDER")
        [ "$ASSEVRA_INPUT_GATE" = "true" ] && args+=(--gate)
        [ "$ASSEVRA_INPUT_STRICT" = "true" ] && args+=(--strict)
        [ "$ASSEVRA_INPUT_ATTEST" = "true" ] && args+=(--attest)
        [ "$ASSEVRA_INPUT_FAIL_ON_REGRESSION" = "true" ] && args+=(--fail-on-regression)
        [ "$ASSEVRA_INPUT_COMMENT" != "true" ] && unset GITHUB_STEP_SUMMARY

        # Capture the exit code so the outputs and the artifact are still
        # produced on a failing gate — a red build is exactly when someone needs
        # to open the report.
        set +e
        assevra run "${args[@]}"
        code=$?
        set -e

        card="$ASSEVRA_INPUT_OUT_DIR/scorecard.json"
        echo "scorecard=$card" >> "$GITHUB_OUTPUT"
        echo "html=$ASSEVRA_INPUT_OUT_DIR/scorecard.html" >> "$GITHUB_OUTPUT"
        if [ -f "$card" ]; then
          python - "$card" >> "$GITHUB_OUTPUT" <<'PY'
        import json, sys
        card = json.load(open(sys.argv[1]))
        scored = [d for d in card["dimensions"] if not d["skipped"]]
        passed = sum(1 for d in scored if d["passed"])
        rows = sum(d["sample_size"] for d in scored)
        skipped = len(card["dimensions"]) - len(scored)
        note = f", {skipped} skipped" if skipped else ""
        print(f"passed={'true' if card['overall_pass'] else 'false'}")
        print(f"summary={passed}/{len(scored)} dimensions passed over {rows} rows{note}")
        PY
        else
          echo "passed=false" >> "$GITHUB_OUTPUT"
          echo "summary=no scorecard produced" >> "$GITHUB_OUTPUT"
        fi
        exit $code
    - name: Upload the scorecard
      if: always() && inputs.upload-artifact == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.out-dir }}
        if-no-files-found: warn
