# Assevra gates Assevra.
#
# This is the project's own configuration — the same file any adopter writes,
# doing the same job. `assevra run` in this repository reads it and needs no
# flags, which is the point: if the tool needs a paragraph of arguments to be
# useful, it will not be used.
#
# Docs: https://assevra.ai/docs/configuration
version: 1

dataset: datasets/golden.jsonl
out_dir: .assevra/out

judge:
  # 'auto' uses whichever provider has credentials in the environment. Forks and
  # local runs have none, so the judged dimensions report as SKIPPED — which is
  # honest, and still leaves a real gate on the deterministic ones.
  provider: auto
  panel: []

gate:
  enabled: true
  fail_on_regression: true

validate:
  on_run: true
  # The golden dataset is fully labeled and must stay that way: an unlabeled row
  # would score as a vacuous pass and quietly weaken the project's own gate.
  strict: true

thresholds:
  grounding: 0.90
  safety: 1.00
  pii: 1.00
  task_completion: 0.90
  tool_call: 0.95
  action_correctness: 1.00
  injection: 1.00

budgets:
  # Only used by rows that record a cost or a latency; the golden rows carry
  # their own per-row budgets so the dataset stays self-contained.
  price:
    input_per_mtok: 3.0
    output_per_mtok: 15.0

reliability:
  pass_k: 2

history:
  path: .assevra/history.jsonl

attest:
  enabled: true
