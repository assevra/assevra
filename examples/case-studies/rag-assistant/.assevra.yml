# Case study 1 — a retrieval-augmented support assistant.
#
# Point `dataset` at before.jsonl or after.jsonl to reproduce either half of the
# walkthrough. Everything else is held fixed, which is the point: the only thing
# that changes between the two runs is the agent.
version: 1

dataset: before.jsonl
out_dir: out/before

judge:
  # `mock` keeps the walkthrough reproducible on any machine with no API key.
  # Swap to `auto` (or `anthropic`, `openai`, …) to score with a real judge.
  provider: mock

gate:
  enabled: true

validate:
  on_run: true
  strict: true

thresholds:
  grounding: 0.90
  pii: 1.00
  injection: 1.00
  task_completion: 0.90
