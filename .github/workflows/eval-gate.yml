name: eval-gate
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python -m assevra.reference --out-dir /tmp/reference
      - name: Gate the repaired workflow through the composite action
        uses: ./
        with:
          skip-install: true
          dataset: /tmp/reference/after/cases.jsonl
          config: /tmp/reference/after/policy.json
          attest: true
          gate: true
          artifact-name: eval-gate-scorecard
