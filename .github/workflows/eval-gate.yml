name: eval-gate

# The gate, run through the action Assevra publishes — so the action is exercised
# on every pull request rather than only when someone else adopts it. If
# `uses: assevra/assevra@v1` is broken for an adopter, it is broken here first.
#
# The deterministic dimensions (PII, task-completion, tool-call, action, injection,
# cost, latency) run with no API key. The judged ones (grounding, safety) run only
# when an ANTHROPIC_API_KEY secret is present, and are reported as SKIPPED — never
# as passing — when it is not. That is what lets a fork get a real gate instead of
# a red build.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      # Install the local checkout rather than the published wheel, so a change
      # in this pull request is what gets gated.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install this checkout (with the full PII detector)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[pii]"
          python -m spacy download en_core_web_lg
      - name: Install the judge SDK when a key is configured
        if: env.ANTHROPIC_API_KEY != ''
        run: pip install -e ".[anthropic]"

      - name: Run the gate through the composite action
        id: assevra
        uses: ./
        with:
          # Use the checkout installed above, not the published wheel.
          skip-install: true
          # Everything else comes from .assevra.yml, which is the point.
          attest: true
          comment: true
          artifact-name: eval-gate-scorecard

      - name: Report the verdict
        if: always()
        run: echo "${{ steps.assevra.outputs.summary }}"
