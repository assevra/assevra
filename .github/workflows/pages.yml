name: Deploy site to GitHub Pages

# Builds the Astro marketing site in web/ and publishes it to GitHub Pages.
# The custom domain (assevra.ai) travels with the artifact via web/public/CNAME.
# Serialized via a concurrency group so rapid pushes queue instead of colliding
# on the single github-pages environment.

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'assevra/**'
      - 'pyproject.toml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # /try runs Assevra in the visitor's browser under WebAssembly. It installs
      # the wheel built from *this commit* rather than whatever is on PyPI, so the
      # page can never score with a different engine than the docs describe.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the wheel the browser will run
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          cp dist/*.whl web/public/
          ls -la web/public/*.whl

      - name: Keep the served schemas identical to the packaged ones
        run: |
          pip install -e .
          python - <<'PY'
          import filecmp, pathlib, shutil
          from assevra import schemas
          served = pathlib.Path("web/public/schema/v1"); served.mkdir(parents=True, exist_ok=True)
          for name in schemas.NAMES:
              target = served / f"{name}.schema.json"
              source = schemas.schema_path(name)
              if not target.exists() or not filecmp.cmp(source, target, shallow=False):
                  shutil.copyfile(source, target)
                  print("synced", target)
          print("schemas in sync")
          PY

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build
        working-directory: web
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
